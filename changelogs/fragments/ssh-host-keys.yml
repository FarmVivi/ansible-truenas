minor_changes:
  - >-
    Add an ssh_configuration module and action plugin to manage persistent SSH
    service settings and host key identities through middlewared.
    Host keys use TrueNAS' private ssh.save_keys helper because TrueNAS 25.10
    exposes them read-only through ssh.update; this keeps the runtime files and
    encrypted services.ssh datastore row in sync across reboots.
